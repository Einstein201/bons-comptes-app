name: CI - Les bons comptes

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend build and test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ format('{0}://{1}:{2}@localhost:5432/if13_test_invitations?schema=public', 'postgresql', 'utilisateur', 'motdepasse') }}
      DATABASE_URL_UNPOOLED: ${{ format('{0}://{1}:{2}@localhost:5432/if13_test_invitations?schema=public', 'postgresql', 'utilisateur', 'motdepasse') }}
      IF13_TEST_DATABASE_URL: ${{ format('{0}://{1}:{2}@localhost:5432/if13_test_invitations?schema=public', 'postgresql', 'utilisateur', 'motdepasse') }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: utilisateur
          POSTGRES_PASSWORD: motdepasse
          POSTGRES_DB: bons_comptes
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ${{ github.workspace }}/backend
        run: |
          test -f package.json
          test -f package-lock.json
          npm ci

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://utilisateur:motdepasse@localhost:5432/bons_comptes?schema=public

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://utilisateur:motdepasse@localhost:5432/bons_comptes?schema=public

      - name: Prepare invitation test database
        run: |
          if ! PGPASSWORD=motdepasse psql -h localhost -U utilisateur -d postgres \
            -tAc "SELECT 1 FROM pg_database WHERE datname = 'if13_test_invitations'" \
            | grep -q 1; then
            PGPASSWORD=motdepasse createdb \
              -h localhost \
              -U utilisateur \
              if13_test_invitations
          fi

      - name: Apply invitation database migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ format('{0}://{1}:{2}@localhost:5432/if13_test_invitations?schema=public', 'postgresql', 'utilisateur', 'motdepasse') }}

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Run end-to-end tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://utilisateur:motdepasse@localhost:5432/bons_comptes?schema=public
          JWT_SECRET: "secret-access-reserve-aux-tests-ci"
          JWT_REFRESH_SECRET: "secret-refresh-reserve-aux-tests-ci"

      - name: Run invitation contract tests
        run: npm run test:invitations
        env:
          IF13_TEST_DATABASE_URL: ${{ format('{0}://{1}:{2}@localhost:5432/if13_test_invitations?schema=public', 'postgresql', 'utilisateur', 'motdepasse') }}
          JWT_SECRET: "if13-local-access-secret"
          JWT_REFRESH_SECRET: "if13-local-refresh-secret"

  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Audit dependencies
        run: npm audit
